name: Appurify
description: Appurify was a mobile app and website testing platform that let developers automate
  testing and optimization of native and web apps on real iOS and Android devices across OS versions
  and simulated network conditions. Founded and backed by DCVC and GV, Appurify was acquired by Google
  in June 2014 and its technology was folded into Firebase Test Lab (formerly Google Cloud Test Lab).
  The company no longer operates independently; the appurify.com domain now redirects to the Firebase
  Test Lab documentation and Appurify's standalone developer API and product have been discontinued.
